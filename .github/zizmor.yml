rules:
  dependabot-cooldown:
    config:
      # Repository policy intentionally uses a one-day release cooldown.
      days: 1
  unpinned-uses:
    config:
      # Repository policy requires full release tags.
      policies:
        "*": ref-pin
  unpinned-tools:
    # Disabled: zizmor cannot resolve tool versions pinned via global env variables (e.g., ${{ env.JUST_VERSION }}).
    disable: true