name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  JUST_VERSION: "1.58.0"
  PYTHON_VERSION: "3.14"
  PYTHON_VERSION_MIN: "3.13"

jobs: 
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  test:
    needs: quality
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: Keep synced with env.PYTHON_VERSION* (matrix parser limitation)
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run -m pytest -v --cov=fastapi_request_observability --cov-branch

  minimum-fastapi:
    needs: quality
    name: Minimum FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION_MIN }}
          enable-cache: true
      - name: Test declared FastAPI floor
        run: >-
          uv run --isolated --with-editable . --with fastapi==0.130.0
          --with pytest --with pytest-asyncio --with pytest-cov --with httpx2
          -m pytest -v --cov=fastapi_request_observability --cov-branch

  build:
    needs: quality
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv build --no-sources
      - name: Inspect distribution contents
        run: python tests/check_distribution.py
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

  e2e-image:
    needs: quality
    name: Consumer image build
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/prepare-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Build consumer image
        run: just e2e-image observability-e2e-local:ci